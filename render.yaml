services:
  - type: web
    name: edital-na-mao
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOW_UPLOAD
        value: "false"
      - key: RATE_LIMIT_CHAT_PER_HOUR
        value: "30"
